global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'user-service:8081'
          - 'task-service:8082'
          - 'api-gateway:8083'
          - 'collaboration-service:8084'
          - 'notification-service:8085'