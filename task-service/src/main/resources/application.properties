# Set a different port to avoid conflicts with the user-service
server.port=8082
spring.application.name=task-service
spring.output.ansi.enabled= always

# H2 Database Settings (a separate in-memory DB for this service)
#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:taskdb
#spring.datasource.driverClassName=org.h2.Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/TaskServiceDB
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Eureka Client Configuration (points to the same Eureka server)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

jwt.secret = ${JWT_SECRET_KEY}
logging.level.root=INFO
